services:

  improvement:
    build:
      dockerfile: DockerfileIMP
    env_file:
      - .env
    command:
      - "python"
      - "-m"
      - "improvement.listener"
    restart: always

  recognition:
    build:
      dockerfile: DockerfileREC
    env_file:
      - .env
    command:
      - "python"
      - "-m"
      - "recognition.listener"
    restart: always

  restapi:
    build:
      dockerfile: Dockerfile
    env_file:
      - .env
    command:
      - "python"
      - "-m"
      - "api.main"
    ports:
      - "8000:8000"
    restart: always

networks:
  default:
